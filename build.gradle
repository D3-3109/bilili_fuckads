// 声明各个子项目使用的构建插件。
plugins {
    alias(libs.plugins.android.application) apply false
}

// 使用 buildRoot 参数指定构建产物目录。
allprojects {
    if (providers.gradleProperty('buildRoot').isPresent()) {
        layout.buildDirectory = file(providers.gradleProperty('buildRoot').get() + '/' + project.name)
    }
}
