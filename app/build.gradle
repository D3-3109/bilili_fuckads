plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'me.bingyue.fuckbiliads'
    compileSdk 35

    defaultConfig {
        applicationId "me.bingyue.fuckbiliads.modern"
        minSdk 27
        targetSdk 35
        versionCode 10
        versionName "4.4-modern102"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly(libs.api)
}
